[package]
name = "shadow"
version = "1.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = "0.4"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["full"] }
http-body-util = "0.1"
hyper = "1"
serial_test = "3.4"
